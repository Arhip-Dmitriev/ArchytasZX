[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qufzx"
version = "0.1.0"
description = "A qufinite ZX-calculus engine and REPL"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy",
    "sympy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
include = ["qufzx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Seed sweeps and oracle differentials are deselected by default. Run them with
# `pytest -m slow` (sweeps only) or `pytest -m ""` (everything); CI runs `pytest -m ""`.
addopts = ["-m", "not slow"]
markers = [
    "slow: multi-thousand-seed fuzz sweep or oracle differential",
]

[tool.ruff]
line-length = 100
# `ruff format` is authoritative for layout and is expected to run clean; `ruff check`
# enforces the lint rules below. Run both.

[tool.ruff.lint]
extend-select = ["E501"]
# E501 (line-too-long) is not in ruff's default select set (line length is usually left to
# a formatter), which is how a declared line-length of 100 sat unenforced. Extending, not
# replacing, the default select set, so no other rule category's behavior changes.

[tool.ruff.lint.per-file-ignores]
# engine.py's module docstring carries large reStructuredText tables (the step-by-step
# ``apply`` walkthrough) that read better unwrapped; every other file in the tree is held
# to the 100-column limit.
"qufzx/rewrite/engine.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true

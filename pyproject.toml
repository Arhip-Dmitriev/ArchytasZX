[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ArchytasZX"
version = "1.1.1"
description = "Size-agnostic quantum algorithm development: symbolic qufinite ZX-calculus for any qudit count and dimension, with proofs checked in Lean"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Arkhip Alekseyevich Dmitriev" }]
# Kept in sync with CITATION.cff.
keywords = [
    "zx-calculus",
    "qufinite",
    "qudit",
    "quantum computing",
    "symbolic algebra",
    "graph rewriting",
    "quantum algorithms",
    "symbolic quantum",
    "graphical calculus",
    "dirac notation",
    "formal verification",
    "lean",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Framework :: Jupyter",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Quantum Computing",
]
dependencies = [
    "numpy",
    "sympy",
]

[project.urls]
Homepage = "https://github.com/Arhip-Dmitriev/ArchytasZX"
Repository = "https://github.com/Arhip-Dmitriev/ArchytasZX"
Documentation = "https://github.com/Arhip-Dmitriev/ArchytasZX/blob/main/docs/INDEX.txt"
Issues = "https://github.com/Arhip-Dmitriev/ArchytasZX/issues"

[project.scripts]
archytaszx = "archytaszx.repl.shell:main"

[project.optional-dependencies]
viz = [
    "matplotlib",
]
dev = [
    "pytest",
    "pytest-xdist",
    "ruff",
    "mypy",
]
bench = [
    "matplotlib",
    "pyzx",
    "qiskit",
]

[tool.setuptools.packages.find]
include = ["archytaszx*"]
exclude = ["archytaszx.lean*"]

[tool.setuptools.package-data]
archytaszx = [
    "lean/*.lean",
    "lean/ArchytasZX/*.lean",
    "lean/lakefile.toml",
    "lean/lean-toolchain",
    "lean/lake-manifest.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Seed sweeps and oracle differentials are deselected by default. Run them with
# `pytest -m slow` (sweeps only) or `pytest -m ""` (everything); CI runs `pytest -m ""`.
# `-n 8` (pytest-xdist) runs either tier across cores.
# Measured 2026-09-25 on 8 cores: the default tier is 4538 tests (118 skipped), 1m00s
# serial and 40s at `-n 8`; `-m slow` is 37 tests, 3m40s at `-n 8`. Wall times swing with
# machine load -- the same default tier measured 1m48s at `-n 8` earlier the same day.
addopts = ["-m", "not slow"]
markers = [
    "slow: multi-thousand-seed fuzz sweep or oracle differential",
]

[tool.ruff]
line-length = 100
# Markdown is excluded: ruff formats fenced code blocks, and doing so collapses the aligned
# annotation columns the docs rely on.
extend-exclude = ["*.md"]
# `ruff format` is authoritative for layout and is expected to run clean; `ruff check`
# enforces the lint rules below. Run both.

[tool.ruff.lint]
extend-select = ["E501"]
# E501 (line-too-long) is not in ruff's default select set (line length is usually left to
# a formatter), which is how a declared line-length of 100 sat unenforced. Extending, not
# replacing, the default select set, so no other rule category's behavior changes.
extend-ignore = ["UP040", "UP046", "UP047"]

[tool.mypy]
python_version = "3.12"
strict = true
